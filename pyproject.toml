[project]
name = "events2rag"
version = "0.6.0"
description = "Ingest events JSON/ICS feeds and upsert vectors to Qdrant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Romkey" }]
# Keep in step with .python-version and the Dockerfile's python image.
# 3.14, not 3.15: onnxruntime (the onnx extra) has no 3.15 wheels yet.
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "icalendar>=7.3.0",
  # recurring-ical-events requires python-dateutil < 3, so 2.9 is the newest.
  "python-dateutil>=2.9.0.post0",
  "qdrant-client>=1.20.0",
  "recurring-ical-events>=3.8.2",
  "requests>=2.34.2",
]

[project.optional-dependencies]
onnx = [
  "huggingface-hub>=2.4.0",
  "numpy>=2.5.4",
  "onnxruntime>=1.31.1",
  "tokenizers>=0.23.3",
]
torch = [
  "sentence-transformers>=6.3.0",
]

[project.urls]
Homepage = "https://github.com/romkey/pdxhackerspace-events2rag"
Changelog = "https://github.com/romkey/pdxhackerspace-events2rag/blob/main/CHANGELOG.md"
Issues = "https://github.com/romkey/pdxhackerspace-events2rag/issues"

[project.scripts]
events2rag = "events2rag.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  # The ONNX embedder's tests run real numpy against faked model libraries.
  "numpy>=2.5.4",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.17.0",
  "types-python-dateutil>=2.9.0.20261104",
  "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "N",            # naming
  "UP",           # modern syntax for requires-python
  "B",            # likely bugs
  "S",            # security
  "C4", "SIM", "RET", "PTH",
  "DTZ",          # timezone-aware datetimes
  "T20",          # no print(); use logging
  "LOG", "G",     # logging calls
  "PT",           # pytest style
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
"scripts/**" = ["T20"]  # command-line tools print

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

# The optional embedding backends are imported only when selected and
# aren't installed for development; the tests replace them with fakes.
[[tool.mypy.overrides]]
module = [
  # Not optional, but ships no type information.
  "recurring_ical_events",
  "huggingface_hub",
  "onnxruntime",
  "sentence_transformers",
  "tokenizers",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
source = ["events2rag"]
branch = true

[tool.coverage.report]
fail_under = 95
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
